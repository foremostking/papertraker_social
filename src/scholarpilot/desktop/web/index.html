<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScholarPilot — AI 学术研究助手</title>

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">

  <!-- 本地 vendor 依赖（不依赖网络，避免加载卡住） -->
  <link rel="stylesheet" href="vendor/github-dark.min.css">
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
</head>
<body>

  <!-- ════════════════════════════════════════════════════════════
       App Root — 整个应用挂载在 #app 上，由 app.js 动态渲染
       ════════════════════════════════════════════════════════════ -->
  <div id="app">

    <!-- ── Sidebar (240px) ─────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
              <path d="M6 4h12a3 3 0 0 1 3 3v17l-3-2-3 2-3-2-3 2-3-2V7a3 3 0 0 1 3-3z"
                    fill="url(#logoGrad)" opacity="0.9"/>
              <defs>
                <linearGradient id="logoGrad" x1="0" y1="0" x2="28" y2="28">
                  <stop offset="0%" stop-color="#6C5CE7"/>
                  <stop offset="100%" stop-color="#0EA5E9"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <span class="logo-text">ScholarPilot</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item active" data-route="#/projects">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
          </svg>
          <span>我的项目</span>
        </a>
        <a class="nav-item" id="nav-progress" style="display:none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/>
          </svg>
          <span>生成进度</span>
        </a>
        <a class="nav-item" id="nav-preview" style="display:none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          <span>论文预览</span>
        </a>
        <a class="nav-item" data-route="#/settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span>设置</span>
        </a>
      </nav>

      <div class="sidebar-section">
        <div class="sidebar-section-title">最近项目</div>
        <div class="sidebar-project-list" id="sidebar-project-list">
          <!-- 动态填充 -->
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="config-badge" id="config-badge">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span id="config-text">配置检查中</span>
        </div>
      </div>
    </aside>

    <!-- 侧边栏拖拽分隔条 -->
    <div class="resizer resizer-vertical" id="sidebar-resizer" title="拖拽调整侧边栏宽度"></div>

    <!-- ── Content Area ────────────────────────────────── -->
    <main class="content-area">

      <!-- Header (48px) -->
      <header class="content-header" id="content-header">
        <div class="breadcrumb" id="breadcrumb">
          <span class="breadcrumb-item">我的项目</span>
        </div>
        <div class="header-actions" id="header-actions">
          <!-- 动态填充 -->
        </div>
      </header>

      <div class="header-divider"></div>

      <!-- Main Content -->
      <div class="main-content" id="main-content">
        <!-- 由 app.js 动态渲染 -->
        <div class="loading-screen">
          <div class="loading-spinner"></div>
          <p>正在初始化 ScholarPilot...</p>
        </div>
      </div>

      <!-- 日志面板拖拽分隔条 -->
      <div class="resizer resizer-horizontal" id="log-resizer" title="拖拽调整日志面板高度"></div>

      <!-- Bottom Panel — 实时日志 (可折叠) -->
      <div class="bottom-panel" id="bottom-panel">
        <div class="bottom-panel-header" id="bottom-panel-toggle">
          <div class="bottom-panel-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
            </svg>
            <span>实时日志</span>
            <span class="log-count" id="log-count">0</span>
          </div>
          <div class="bottom-panel-actions">
            <button class="btn btn-ghost btn-sm" id="copy-logs-btn" title="复制全部日志">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              <span>复制</span>
            </button>
            <svg class="bottom-panel-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
        </div>
        <div class="bottom-panel-body" id="log-body">
          <div class="log-stream" id="log-stream"></div>
        </div>
      </div>

    </main>
  </div>

  <!-- ════════════════════════════════════════════════════════════
       模态框容器 — 对话框 / Toast 挂载点
       ════════════════════════════════════════════════════════════ -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!-- 划词浮动工具栏 -->
  <div class="selection-toolbar" id="selection-toolbar" style="display:none;">
    <button class="toolbar-btn" data-action="comment" title="评论">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span>评论</span>
    </button>
    <button class="toolbar-btn" data-action="rewrite" title="重写">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      <span>重写</span>
    </button>
    <button class="toolbar-btn" data-action="explain" title="解释">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <span>解释</span>
    </button>
  </div>

  <!-- App Script -->
  <script src="app.js"></script>
</body>
</html>
