[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholarpilot"
version = "0.1.0"
description = "学术论文写作 AI Agent - 基于 LangGraph + LiteLLM + MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "ScholarPilot Team" }
]
keywords = ["academic-writing", "ai-agent", "langgraph", "litellm", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # LangGraph 核心
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
    # LLM 统一调用
    "litellm>=1.40.0",
    # MCP 官方 SDK
    "mcp>=1.0.0",
    # CLI & 终端
    "rich>=13.0.0",
    "typer>=0.12.0",
    # 数据模型 & 配置
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # 向量存储 & 检索
    "chromadb>=0.5.0",
    # 文档处理
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "jinja2>=3.1.0",
    # 缓存
    "diskcache>=5.6.0",
    # HTTP & 网页抓取
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
scholarpilot = "scholarpilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/scholarpilot"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
